experiment_settings:
  mode: train
  output_dir: /101045/jinyu/PhysPPI_jinyu/PhysPPI/experiments/_runtime/8gpu_model_v2/benchmark_runs/385_512_B1
  seed: 42
  restart_checkpoint_path: null
  preemption_safe_resume: false
  ckpt_load_settings:
    manual_checkpoint_loading: false
    init_from_ema_weights: false
    restore_lr_scheduler: false
    restore_time_step: false
    strict_loading: true
data_module_args:
  batch_size: 1
  num_workers: 0
  epoch_len: 24
  data_seed: 42
  pin_memory: true
  distinct_samples_per_rank_group: false
  global_datapoint_sampling: false
logging_config:
  log_lr: true
pl_trainer_args:
  devices: 8
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: 1
  max_steps: 3
  log_every_n_steps: 10
  accumulate_grad_batches: 1
  val_check_interval: 1
  limit_val_batches: 0
  num_sanity_val_steps: 0
checkpoint_config:
  dirpath: /101045/jinyu/PhysPPI_jinyu/PhysPPI/experiments/_runtime/8gpu_model_v2/benchmark_runs/385_512_B1/checkpoint
  filename: step-{step:06d}
  every_n_epochs: 0
  every_n_train_steps: 0
  save_on_train_epoch_end: false
  save_top_k: 0
  save_last: false
  auto_insert_metric_name: false
model_update:
  presets:
  - train
  custom:
    settings:
      training_scope: physppi_lora_assessment
      train_confidence_only: false
      memory:
        eval:
          use_deepspeed_evo_attention: false
      gradient_clipping:
        per_sample_clipping: false
    architecture:
      heads:
        pdockq:
          head_module: /101045/jinyu/PhysPPI_jinyu/PhysPPI/experiments/_runtime/4gpu_model_v1/pdockq_head_v1.py
      physppi:
        enabled: true
        optional_prior_conditioner:
          enabled: true
          num_interaction_types: 5
        membrane_geometry:
          enabled: true
          normal_error_bins: 16
          depth_cutoff: 30.0
dataset_configs:
  train:
    qbiolip_train:
      dataset_class: QBioLiP10kDataset
      weight: 0.5
      config:
        debug_mode: false
        template:
          n_templates: 4
          take_top_k: false
        crop:
          token_crop:
            enabled: true
            token_budget: 512
            crop_weights:
              contiguous: 0.0
              spatial: 0.5
              spatial_interface: 0.5
          chain_crop:
            enabled: true
        physppi:
          root: /101045/jinyu/PPI/Prior_out/precomputed_mesh/cli_v3/Q-BioLiP-10k-new
          num_surface_neighbors: 64
          index_cache_file: /101045/jinyu/PhysPPI_jinyu/PhysPPI/experiments/_runtime/cache/qbiolip_index.json
          loss_weight: 1.0
          sample_ids:
          - 5ikc_1
          - 6h7l_2
          - 6h7m_2
          - 6rv2_1
          max_samples: 4
        loss:
          confidence_loss_names:
          - plddt
          - pde
          - pae
          loss_weights:
            experimentally_resolved: 0.0
            pde: 0.0001
    afdb_train:
      dataset_class: AFDB10kDataset
      weight: 0.5
      config:
        debug_mode: false
        template:
          n_templates: 4
          take_top_k: false
        crop:
          token_crop:
            enabled: true
            token_budget: 512
            crop_weights:
              contiguous: 0.0
              spatial: 0.5
              spatial_interface: 0.5
          chain_crop:
            enabled: true
        physppi:
          root: /101045/jinyu/PPI/Prior_out/precomputed_mesh/cli_v3/AFDB-10k-1
          num_surface_neighbors: 64
          index_cache_file: /101045/jinyu/PhysPPI_jinyu/PhysPPI/experiments/_runtime/cache/afdb_index.json
          loss_weight: 0.8
          sample_ids:
          - AF-0000000065845438-model_v1
          - AF-0000000065982593-model_v1
          - AF-0000000065982594-model_v1
          - AF-0000000066212880-model_v1
          max_samples: 4
        loss:
          confidence_loss_names:
          - plddt
          - pde
          - pae
          loss_weights:
            experimentally_resolved: 0.0
            pde: 0.0001
