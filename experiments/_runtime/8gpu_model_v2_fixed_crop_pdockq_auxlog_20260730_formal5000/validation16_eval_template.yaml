experiment_settings:
  mode: eval
  output_dir: experiments/_runtime/8gpu_model_v2_fixed_crop_pdockq_auxlog_20260730_formal5000/eval_template_output
  seed: 42
  restart_checkpoint_path: /101045/jinyu/PhysPPI_jinyu/PhysPPI/experiments/_runtime/8gpu_model_v2_fixed_crop_pdockq_auxlog_20260730_smoke80/_aborted_attempts/pre_val_cap_20260730/checkpoint/step-000050.ckpt
  preemption_safe_resume: false
  ckpt_load_settings:
    manual_checkpoint_loading: true
    init_from_ema_weights: false
    restore_lr_scheduler: false
    restore_time_step: false
    strict_loading: true
data_module_args:
  batch_size: 1
  num_workers: 0
  epoch_len: 4096
  data_seed: 42
  pin_memory: true
  distinct_samples_per_rank_group: false
  global_datapoint_sampling: true
logging_config:
  log_lr: true
  log_level: error
pl_trainer_args:
  devices: 8
  num_nodes: 1
  precision: bf16-mixed
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
checkpoint_config:
  dirpath: experiments/_runtime/8gpu_model_v2_fixed_crop_pdockq_auxlog_20260730_formal5000/eval_template_output/checkpoint
  filename: step-{step:06d}
  every_n_epochs: 0
  every_n_train_steps: 50
  save_on_train_epoch_end: false
  save_top_k: -1
  save_last: true
  auto_insert_metric_name: false
model_update:
  presets:
  - train
  custom:
    settings:
      training_scope: physppi_lora_assessment
      train_confidence_only: false
      memory:
        eval:
          use_deepspeed_evo_attention: false
      validation_artifacts:
        enabled: true
        output_dir: experiments/_runtime/8gpu_model_v2_fixed_crop_pdockq_auxlog_20260730_formal5000/eval_template_output/validation_artifacts
        structure_format: pdb
        expected_samples: 24
        fail_on_sample_count_mismatch: true
        profile_timing: true
        synchronize_cuda_timing: true
      validation_use_ema_weights: false
    architecture:
      loss_module:
        membrane:
          include_in_total_loss: false
        interaction_auxiliary:
          include_in_total_loss: false
      heads:
        pdockq:
          head_module: /101045/jinyu/PhysPPI_jinyu/PhysPPI/experiments/_runtime/4gpu_model_v1/pdockq_head_v1.py
      physppi:
        enabled: true
        optional_prior_conditioner:
          enabled: true
          num_interaction_types: 5
        membrane_geometry:
          enabled: true
          normal_error_bins: 16
          depth_cutoff: 30.0
      shared:
        diffusion:
          no_samples: 24
          no_full_rollout_samples: 24
