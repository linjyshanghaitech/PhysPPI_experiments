schema_version = 1

[experiment]
name = "permutation-alignment"
run_name = "audit-protected-chain-matching-v1"
module = "experiments.permutation_alignment.audit_protected_chain_matching"
args = [
  "--runtime-ledger", "${PHYSPPI_FORMAL_ROOT}/manifests/runtime-failure-ledger.jsonl",
  "--qbiolip-root", "${PHYSPPI_QBIOLIP_ROOT}",
  "--afdb-root", "${PHYSPPI_AFDB_ROOT}",
  "--formal-root", "${PHYSPPI_FORMAL_ROOT}",
  "--components-cif", "${PHYSPPI_COMPONENTS_CIF}",
  "--output", "${PHYSPPI_OUTPUT_ROOT}/experiments/permutation_alignment/audit-protected-chain-matching-v1/audit.jsonl",
]

[slurm]
profile = "configs/slurm/cpu_debug.toml"
job_name = "ppi-protected-audit"

[artifacts]
output_dir = "${PHYSPPI_OUTPUT_ROOT}/experiments/permutation_alignment/audit-protected-chain-matching-v1"

[environment]
required = [
  "PHYSPPI_QBIOLIP_ROOT",
  "PHYSPPI_AFDB_ROOT",
  "PHYSPPI_FORMAL_ROOT",
  "PHYSPPI_COMPONENTS_CIF",
  "PHYSPPI_OUTPUT_ROOT",
]

[validation]
required_files = [
  "${PHYSPPI_FORMAL_ROOT}/manifests/runtime-failure-ledger.jsonl",
  "${PHYSPPI_COMPONENTS_CIF}",
  "${PHYSPPI_FORMAL_ROOT}/reader-index-cache/qbiolip10k-v1.pkl",
  "${PHYSPPI_FORMAL_ROOT}/reader-index-cache/afdb10k-v1.pkl",
  "${PHYSPPI_FORMAL_ROOT}/manifests/qbiolip-audit.json",
  "${PHYSPPI_FORMAL_ROOT}/manifests/afdb-audit.json",
  "${PHYSPPI_FORMAL_ROOT}/audits/v1-v32-full-20k-data-errors/data-error-ids.json",
]
required_directories = [
  "${PHYSPPI_QBIOLIP_ROOT}",
  "${PHYSPPI_AFDB_ROOT}",
  "${PHYSPPI_FORMAL_ROOT}",
]
