experiment_settings:
  mode: train
  output_dir: ./physppi_train_output
  restart_checkpoint_path: last

data_module_args:
  batch_size: 1
  num_workers: 16
  epoch_len: 128000

logging_config:
  log_lr: true
  wandb_config:
    project: <project_name>
    entity: <entity_name>
    group: null
    id: null
    experiment_name: <experiment_name>

pl_trainer_args:
  devices: 4
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: -1
  log_every_n_steps: 50
  mpi_plugin: false
  deepspeed_config_path: null

checkpoint_config:
  every_n_epochs: 1
  auto_insert_metric_name: false
  save_last: true
  save_top_k: -1

model_update:
  presets:
    - train
  custom:
    settings:
      training_scope: physppi_priors_only
      train_confidence_only: false
    architecture:
      physppi:
        enabled: true
        optional_prior_conditioner:
          enabled: true
          num_interaction_types: 5
        membrane_geometry:
          enabled: true
          normal_error_bins: 16
          depth_cutoff: 30.0

dataset_configs:
  train:
    qbiolip10k:
      dataset_class: QBioLiP10kDataset
      weight: 0.8
      config:
        debug_mode: true
        template:
          n_templates: 4
          take_top_k: false
        crop:
          token_crop:
            enabled: true
            token_budget: 384
            crop_weights:
              contiguous: 0.0
              spatial: 0.5
              spatial_interface: 0.5
          chain_crop:
            enabled: true
        physppi:
          root: /101045/jinyu/PPI/Prior_out/precomputed_mesh/cli_v3/Q-BioLiP-10k-new
          num_surface_neighbors: 64
        loss:
          confidence_loss_names: [plddt, pde, pae]
          loss_weights:
            experimentally_resolved: 0.0
            pde: 1.0e-4

    afdb10k:
      dataset_class: AFDB10kDataset
      weight: 0.2
      config:
        debug_mode: true
        template:
          n_templates: 4
          take_top_k: false
        crop:
          token_crop:
            enabled: true
            token_budget: 384
            crop_weights:
              contiguous: 0.0
              spatial: 0.5
              spatial_interface: 0.5
          chain_crop:
            enabled: true
        physppi:
          root: /101045/jinyu/PPI/Prior_out/precomputed_mesh/cli_v3/AFDB-10k-1
          num_surface_neighbors: 64
        loss:
          confidence_loss_names: [plddt, pde, pae]
          loss_weights:
            experimentally_resolved: 0.0
            pde: 1.0e-4

dataset_paths:
  qbiolip10k:
    alignments_directory: none
    alignment_db_directory: none
    alignment_array_directory: /shared/openfold3/pdb_training_set/alignment_arrays
    dataset_cache_file: /shared/openfold3/pdb_training_set/dataset_caches/training_cache_with_templates.json
    target_structures_directory: /shared/openfold3/pdb_training_set/preprocessed_pdb_data/standard/structure_files
    target_structure_file_format: npz
    reference_molecule_directory: /shared/openfold3/pdb_training_set/preprocessed_pdb_data/standard/reference_mols
    template_cache_directory: /shared/openfold3/pdb_training_set/templates/train_template_cache
    template_structure_array_directory: /shared/openfold3/pdb_training_set/templates/template_structure_arrays
    template_structures_directory: none
    template_file_format: npz
    ccd_file: null
  afdb10k:
    alignments_directory: none
    alignment_db_directory: none
    alignment_array_directory: /shared/openfold3/pdb_training_set/alignment_arrays
    dataset_cache_file: /shared/openfold3/pdb_training_set/dataset_caches/training_cache_with_templates.json
    target_structures_directory: /shared/openfold3/pdb_training_set/preprocessed_pdb_data/standard/structure_files
    target_structure_file_format: npz
    reference_molecule_directory: /shared/openfold3/pdb_training_set/preprocessed_pdb_data/standard/reference_mols
    template_cache_directory: /shared/openfold3/pdb_training_set/templates/train_template_cache
    template_structure_array_directory: /shared/openfold3/pdb_training_set/templates/template_structure_arrays
    template_structures_directory: none
    template_file_format: npz
    ccd_file: null
